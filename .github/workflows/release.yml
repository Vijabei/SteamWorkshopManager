name: Build and release

# Pushing a tag builds the release and prepares it as a draft.
# Pushing to main only builds, so a broken build is noticed early.
# "Run workflow" builds without touching releases - useful for a test build.
on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

# Needed to create the release. Nothing else is written.
permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      - name: Get the source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read the version from the project file
        id: version
        shell: pwsh
        run: |
          $version = (Select-Xml -Path WorkshopManager.csproj -XPath '//Version').Node.InnerText
          if (-not $version) { throw 'No <Version> found in WorkshopManager.csproj' }

          # A pre-release version carries a suffix, e.g. 1.3.0-beta.1
          $isPreRelease = $version -match '-'

          "version=$version"            >> $env:GITHUB_OUTPUT
          "tag=v$version"               >> $env:GITHUB_OUTPUT
          "prerelease=$($isPreRelease.ToString().ToLower())" >> $env:GITHUB_OUTPUT

          Write-Host "Project version: $version (pre-release: $isPreRelease)"

      # A tag that disagrees with the project file would produce a release
      # whose contents report a different version than its name - and the
      # updater compares exactly those. Fail loudly instead.
      - name: Check the tag against the project version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $expected = '${{ steps.version.outputs.tag }}'
          if ($tag -ne $expected) {
            throw "Tag '$tag' does not match the project version ('$expected'). Bump <Version> in WorkshopManager.csproj or retag."
          }
          Write-Host "Tag and project version agree: $tag"

      - name: Build
        run: dotnet publish WorkshopManager.csproj -c Release

      # The informational version is what the updater reads at runtime. If it
      # does not match the project file, update checks would misbehave.
      - name: Verify the built executable
        id: exe
        shell: pwsh
        run: |
          $exe = 'bin/Release/net8.0-windows/win-x64/publish/WorkshopManager.exe'
          if (-not (Test-Path $exe)) { throw "Build produced no executable at $exe" }

          $item = Get-Item $exe
          if ($item.Length -lt 100kb) { throw "Executable looks too small: $($item.Length) bytes" }

          # Build metadata ("+<commit>") is appended by the SDK and carries no meaning here
          $stamped = ($item.VersionInfo.ProductVersion -split '\+')[0]
          $expected = '${{ steps.version.outputs.version }}'
          if ($stamped -ne $expected) {
            throw "Executable reports version '$stamped' but the project says '$expected'"
          }

          Write-Host "Executable: $($item.Length) bytes, version $stamped"
          "path=$exe" >> $env:GITHUB_OUTPUT

      - name: Package
        id: package
        shell: pwsh
        run: |
          $zip = 'WorkshopManager-${{ steps.version.outputs.tag }}-win-x64.zip'
          Compress-Archive -Path '${{ steps.exe.outputs.path }}' -DestinationPath $zip -Force

          # The updater looks for this exact entry name inside the zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $names = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $zip)).Entries.Name
          if ($names -notcontains 'WorkshopManager.exe') {
            throw "The zip does not contain WorkshopManager.exe (found: $($names -join ', '))"
          }

          Write-Host "Packaged $zip"
          "zip=$zip" >> $env:GITHUB_OUTPUT

      # Always kept, so a build from main or a manual run can be downloaded
      # and tested without publishing anything.
      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: WorkshopManager-${{ steps.version.outputs.version }}
          path: ${{ steps.package.outputs.zip }}
          retention-days: 30

      # Deliberately a draft: publishing a release makes every installed copy
      # offer the update on its next start. That should be a decision, not a
      # side effect of pushing a tag. Review the notes, then hit publish.
      - name: Prepare the release as a draft
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $args = @(
            '${{ steps.version.outputs.tag }}'
            '${{ steps.package.outputs.zip }}'
            '--draft'
            '--generate-notes'
            '--title', 'Workshop Manager ${{ steps.version.outputs.version }}'
          )
          if ('${{ steps.version.outputs.prerelease }}' -eq 'true') { $args += '--prerelease' }

          gh release create @args
          Write-Host 'Draft release created. Review the notes and publish it on GitHub.'
